<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2226">
<meta name="description" content="Registro de expediente, produção e ocorrências das equipes de monitoramento.">
<title>Expediente</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:#E9ECED; --surface:#F8F9F9; --white:#FFFFFF; --ink:#1B2226; --muted:#526068; --rule:#C9D0D3; --rule-soft:#DCE1E3;
  --green:#0B6B4A; --green-soft:#D3E8DF; --green-ink:#0B4A34; --accent:#5B3FA0; --accent-soft:#E7E1F5;
  --red:#A02C21; --red-soft:#F6D9D5; --amber-ink:#7A5A00; --amber-soft:#FBEFC7; --amber:#D99A00;
  --display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #CDD3D6; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 480px; margin: 0 auto; height: 100dvh; background: var(--paper); position: relative; overflow: hidden; display: flex; flex-direction: column; }
.tela { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.conteudo { flex: 1 1 auto; overflow-y: auto; padding: 20px; -webkit-overflow-scrolling: touch; }
.rodape { padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; background: var(--paper); }

/* cabeçalho */
.cab { background: var(--ink); color: var(--surface); padding: calc(16px + env(safe-area-inset-top, 0px)) 12px 14px 20px; display: flex; align-items: flex-end; gap: 10px; flex: 0 0 auto; }
.cab-esq { flex: 1 1 auto; min-width: 0; }
.cab-eq { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 1; }
.cab-sub { font-size: 13px; color: var(--rule); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cab-dir { text-align: right; flex: 0 0 auto; }
.cab-data { font-size: 13px; color: var(--rule); margin-bottom: 6px; }
.cab-menu { width: 44px; height: 44px; border: 0; background: transparent; color: var(--surface); display: flex; align-items: center; justify-content: center; border-radius: 8px; flex: 0 0 auto; align-self: center; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 0; }
.sync i { width: 8px; height: 8px; border-radius: 50%; }
.sync.ok { background: var(--green-soft); color: var(--green); } .sync.ok i { background: var(--green); }
.sync.fila { background: var(--accent-soft); color: var(--accent); } .sync.fila i { background: var(--accent); }
.sync.off { background: var(--amber-soft); color: var(--amber-ink); } .sync.off i { background: var(--amber); }
.sync.teste { background: var(--rule-soft); color: var(--ink); } .sync.teste i { background: var(--muted); }

/* tipografia */
.marca { font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--muted); letter-spacing: .02em; }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.05; margin: 6px 0 22px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.08; margin: 0 0 14px; }
h3 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 22px 0 8px; }
.rotulo { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; }
.rotulo:first-child { margin-top: 0; }
.nota { font-size: 14px; color: var(--muted); margin: 14px 0 0; }
.erro-txt { color: var(--red); font-size: 14px; font-weight: 600; margin-top: 8px; }

/* campos */
.campo { height: 54px; width: 100%; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); padding: 0 16px; font-size: 20px; }
.campo.grande { height: 64px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 34px; padding: 0 8px; }
textarea.campo { height: auto; padding: 12px 14px; font-size: 16px; resize: none; }
.pin { letter-spacing: .3em; font-size: 22px; }
.pin::placeholder { letter-spacing: normal; font-size: 18px; }
.duas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

/* botões */
.btn { width: 100%; border: 0; border-radius: 12px; font-family: var(--display); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn.g { height: 66px; font-size: 27px; }
.btn.m { height: 60px; font-size: 24px; }
.btn.verde { background: var(--green); color: #fff; }
.btn.roxo { background: var(--accent); color: #fff; }
.btn.escuro { background: var(--ink); color: var(--surface); }
.btn.vermelho { background: var(--red); color: #fff; }
.btn[disabled] { opacity: .6; }
.btn-sec { height: 50px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); font-weight: 600; font-size: 15px; width: 100%; }
.btn-sec.perigo { border: 1.5px solid var(--red); color: var(--red); }
.btn-txt { height: 48px; border: 1px solid var(--rule); border-radius: 10px; background: transparent; font-weight: 600; width: 100%; }
.voltar { height: 44px; border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 0; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 2px; }
.svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* login */
.eq-chip { height: 64px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); padding: 6px 4px; text-align: center; }
.eq-chip b { display: block; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; }
.eq-chip span { display: block; font-size: 12px; margin-top: 3px; }
.eq-chip[aria-pressed="true"] { background: var(--accent); border: 2px solid var(--accent); color: #fff; }
.bloco-rot { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; }
.bloco-rot:first-of-type { margin-top: 0; }

/* cartões */
.cartao { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; }
.cartao-cab { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.local-rod { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.1; margin-top: 8px; }
.linha-pill { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 14px; color: var(--muted); }
.pill { display: inline-block; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.pill.na { background: var(--green-soft); color: var(--green); }
.pill.perto { background: var(--amber-soft); color: var(--amber-ink); }
.pill.fora { background: var(--red-soft); color: var(--red); }
.pill.sem { background: var(--rule-soft); color: var(--ink); }
.aviso-local { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rule); font-size: 14px; }
.banner { border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
.banner.teste { background: var(--rule-soft); border: 1px dashed var(--muted); }
.banner.alerta { background: var(--amber-soft); color: var(--amber-ink); }
.banner.erro { background: var(--red-soft); color: var(--red); }
.banner b { font-weight: 700; }
.status { background: var(--green-soft); color: var(--green-ink); border-radius: 12px; padding: 16px; }
.status-rot { font-size: 13px; font-weight: 600; }
.status-hora { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.05; margin-top: 2px; }
.status-sub { font-size: 14px; margin-top: 4px; }
.status-res { font-size: 14px; font-weight: 600; margin-top: 8px; padding-top: 8px; border-top: 1px solid #A9CFC0; }

/* toggle reserva */
.toggle { width: 100%; margin-top: 16px; min-height: 60px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; font-size: 15px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; text-align: left; }
.toggle[aria-pressed="true"] { border: 2px solid var(--accent); border-radius: 10px 10px 0 0; }
.caixa { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #8A989F; background: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.toggle[aria-pressed="true"] .caixa { background: var(--accent); border-color: var(--accent); }
.toggle b { display: block; font-weight: 600; }
.toggle small { display: block; font-size: 13px; color: var(--muted); }
.reserva { background: var(--surface); border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 10px 10px; padding: 4px 14px 16px; }
.reserva .campo { background: #fff; }
.placa { text-transform: uppercase; letter-spacing: .06em; }

/* lista do dia */
.lista-cab { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 8px; }
.lista-cab h3 { margin: 0; font-size: 24px; }
.lista-cab span { font-size: 13px; color: var(--muted); }
.vazio { border: 1px dashed var(--rule); border-radius: 10px; padding: 16px; color: var(--muted); font-size: 15px; }
.item { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.item-ico { width: 22px; display: flex; justify-content: center; color: var(--muted); flex: 0 0 auto; }
.dot { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; }
.item-txt { flex: 1 1 auto; min-width: 0; }
.item-txt b { display: block; font-weight: 600; }
.item-txt small { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-num { text-align: right; flex: 0 0 auto; }
.item-num b { display: block; font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1; }
.item-num small { font-size: 12px; color: var(--muted); }

/* produção */
.disc { min-height: 56px; border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; border: 1px solid var(--rule); background: var(--surface); text-align: left; line-height: 1.15; }
.disc[aria-pressed="true"] { border: 2px solid var(--ink); background: var(--accent-soft); }
.stepper { display: flex; gap: 8px; }
.stepper button { flex: 0 0 64px; height: 64px; border: 1px solid var(--rule); border-radius: 10px; background: var(--surface); display: flex; align-items: center; justify-content: center; }
.auto { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; font-size: 14px; color: var(--muted); }

/* motivos */
.mot { min-height: 96px; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; font-size: 15px; border: 1px solid var(--rule); background: var(--surface); }
.mot b { font-weight: 600; line-height: 1.15; }
.mot small { font-size: 12px; opacity: .85; }
.mot[aria-pressed="true"] { border: 2px solid var(--ink); background: var(--ink); color: var(--surface); }

/* foto */
.foto-tile { min-height: 120px; width: 100%; border: 2px dashed #8A989F; border-radius: 12px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 12px; cursor: pointer; }
.foto-tile b { font-size: 16px; }
.foto-tile small { font-size: 13px; color: var(--muted); }
.foto-ok { display: flex; gap: 12px; align-items: center; border: 1px solid var(--rule); border-radius: 12px; padding: 10px; background: var(--surface); }
.foto-ok img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; flex: 0 0 auto; }
.foto-ok div { flex: 1 1 auto; min-width: 0; }
.foto-ok small { display: block; font-size: 13px; color: var(--muted); }
.foto-ok label { flex: 0 0 auto; height: 44px; padding: 0 14px; display: flex; align-items: center; border: 1px solid var(--rule); border-radius: 8px; background: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }

/* encerrar */
.trio { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.trio div { padding: 14px; border-right: 1px solid var(--rule-soft); }
.trio div:last-child { border-right: 0; }
.trio small { display: block; font-size: 12px; color: var(--muted); }
.trio b { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.15; }
.tot { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.tot span { flex: 1 1 auto; font-weight: 600; }
.tot span.dot { flex: 0 0 14px; }
.tot b { font-family: var(--display); font-weight: 700; font-size: 22px; }

/* fim */
.fim { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 30px; }
.check { width: 84px; height: 84px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: flex; align-items: center; justify-content: center; }
.fim h2 { font-size: 34px; margin: 18px 0 6px; }
.fim p { margin: 0 0 6px; }
.fim .envio { margin-top: 18px; padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; }

/* menu e toast */
.veu { position: absolute; inset: 0; background: rgba(27,34,38,.45); display: flex; align-items: flex-end; z-index: 20; }
.folha { background: var(--paper); width: 100%; border-radius: 16px 16px 0 0; padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.folha h3 { margin: 4px 0 4px; }
.folha p { margin: 0; font-size: 14px; color: var(--muted); }
.toast { position: absolute; left: 20px; right: 20px; bottom: 150px; background: var(--ink); color: var(--surface); border-radius: 10px; padding: 14px 16px; font-weight: 600; font-size: 15px; text-align: center; z-index: 30; }
.ocupado { position: absolute; inset: 0; background: rgba(233,236,237,.7); display: flex; align-items: center; justify-content: center; z-index: 25; font-weight: 600; }
.ocupado div { background: var(--surface); border: 1px solid var(--rule); padding: 14px 18px; border-radius: 10px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"><div class="conteudo"><p>Carregando…</p></div></main>
<noscript>Este app precisa de JavaScript ligado.</noscript>
<script src="config.js"></script>
<script src="malha.js"></script>
<script src="app.js"></script>
</body>
</html>
